name: Deploy React + Next.js to VPS

# on:
#   repository_dispatch:
#      types: [backend_deployed]
#   workflow_dispatch:
on:
  workflow_run:
    workflows: ["CI/CD"]  # Tên workflow backend (phải khớp chính xác)
    types:
      - completed
    branches: [origin/nodejs_react]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}  # Chỉ chạy khi backend thành công
    defaults:
          run:
            working-directory: ./react-nextjs-nodejs 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract metadata
        id: meta
        run: |
            echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_OUTPUT"
            echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Next.js Image
        uses: docker/build-push-action@v6
        with:
          context: ./react-nextjs-nodejs
          file: ./react-nextjs-nodejs/Dockerfile
          push: true
          tags: |
              ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKERHUB_PROJECT_NAME_REACT }}:latest
              ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKERHUB_PROJECT_NAME_REACT }}:${{ steps.meta.outputs.SHORT_SHA }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            # Login vào Docker Hub (để pull private image nếu có)
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # Pull image mới nhất từ Docker Hub
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKERHUB_PROJECT_NAME_REACT }}:latest

            # Dừng và xóa container cũ (nếu có)
            docker stop ${{ secrets.DOCKERHUB_PROJECT_NAME_REACT }} || true
            docker rm ${{ secrets.DOCKERHUB_PROJECT_NAME_REACT }} || true

            # Tạo network nếu chưa tồn tại
            docker network ls | grep app-net || docker network create app-net

            docker run -d \
              --name ${{ secrets.DOCKERHUB_PROJECT_NAME_REACT }} \
              --restart always \
              --network app-net \
              -p 3000:3000 \
              -e NODE_ENV=production \
              -e NEXT_PUBLIC_API_URL_SOCKET=http://${{ secrets.DOCKERHUB_PROJECT_NAME }}:9000 \
              ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKERHUB_PROJECT_NAME_REACT }}:latest

