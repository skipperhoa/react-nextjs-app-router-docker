name: CI/CD Fullstack Application

on:
  push:
    branches: [nodejs_react]

jobs:
  backend-ci:
    name: Run Node.js Tests
    runs-on: ubuntu-latest # chọn hệ điều hành ubuntu mới nhất
    defaults:
      run:
        working-directory: ./nodejs  # đường dẫn thư mục nodejs
    strategy:
      matrix:
        node-version: [20.x] # 18.x, 16.x, 14.x,...
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'  # dùng cache npm giúp nhanh
          cache-dependency-path: './nodejs/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint || echo "Linting failed but continuing..."

      - name: Run tests
        run: npm test || echo "No tests found"

  build-and-push:
    name: Build and Push Backend Docker
    runs-on: ubuntu-latest
    needs: backend-ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./nodejs
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKERHUB_PROJECT_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKERHUB_PROJECT_NAME }}:${{ github.sha }}

  deploy-backend:
    name: Deploy Backend to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: SSH Deploy Backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKERHUB_PROJECT_NAME }}:latest
            docker stop ${{ secrets.DOCKERHUB_PROJECT_NAME }} || true
            docker rm ${{ secrets.DOCKERHUB_PROJECT_NAME }} || true
            
            # Tạo network nếu chưa có
            docker network ls | grep app-net || docker network create app-net

            docker run -d \
              --name ${{ secrets.DOCKERHUB_PROJECT_NAME }} \
              --restart always \
              --network app-net \
              -p 9000:9000 \
              -e NODE_ENV=production \
              -e POSTGRES_HOST=${{ secrets.PROD_DB_HOST }} \
              -e POSTGRES_USER=${{ secrets.PROD_DB_USER }} \
              -e POSTGRES_PASSWORD=${{ secrets.PROD_DB_PASSWORD }} \
              -e POSTGRES_DB=${{ secrets.PROD_DB_NAME }} \
              ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKERHUB_PROJECT_NAME }}:latest

  frontend-deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend # QUAN TRỌNG: Đợi Backend xong mới chạy
    defaults:
      run:
        working-directory: ./react-nextjs-nodejs 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Next.js Image
        uses: docker/build-push-action@v6
        with:
          context: ./react-nextjs-nodejs
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKERHUB_PROJECT_NAME_REACT }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKERHUB_PROJECT_NAME_REACT }}:${{ github.sha }}

      - name: SSH Deploy Frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKERHUB_PROJECT_NAME_REACT }}:latest
            docker stop ${{ secrets.DOCKERHUB_PROJECT_NAME_REACT }} || true
            docker rm ${{ secrets.DOCKERHUB_PROJECT_NAME_REACT }} || true

            docker run -d \
              --name ${{ secrets.DOCKERHUB_PROJECT_NAME_REACT }} \
              --restart always \
              --network app-net \
              -p 3000:3000 \
              -e NODE_ENV=production \
              -e NEXT_PUBLIC_API_URL_SOCKET=http://${{ secrets.DOCKERHUB_PROJECT_NAME }}:9000 \
              ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKERHUB_PROJECT_NAME_REACT }}:latest