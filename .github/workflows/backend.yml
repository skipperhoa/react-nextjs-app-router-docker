name: CI/CD # Node.js CI/CD Application
on:
    push:
        branches: [origin/nodejs_react]
jobs:
    test:
        name: Run Node.js Tests
        runs-on: ubuntu-latest
        defaults:
          run:
            working-directory: ./nodejs 

        strategy:
          matrix:
            node-version: [18.x, 20.x]
          
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v3
              with:
                node-version: ${{ matrix.node-version }}
                cache: 'npm'
                cache-dependency-path: './nodejs/package-lock.json'


            - name: Install dependencies
              run: npm ci
             

            - name: Run linting
              run: npm run lint

            - name: Run tests
              run: npm test

    build-and-push:
        name: Build and Push Docker Image
        runs-on: ubuntu-latest
        needs: test

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Cache Docker layers
              uses: actions/cache@v4
              with:
                  path: /tmp/.buildx-cache
                  key: ${{ runner.os }}-buildx-${{ github.sha }}
                  restore-keys: ${{ runner.os }}-buildx-

            - name: Extract metadata
              id: meta
              run: |
                  echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_OUTPUT"
                  echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push multi-arch production image
              uses: docker/build-push-action@v6
              with:
                  context: ./nodejs
                  target: production
                  push: true
                  platforms: linux/amd64,linux/arm64
                  tags: |
                      ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKERHUB_PROJECT_NAME }}:latest
                      ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKERHUB_PROJECT_NAME }}:${{ steps.meta.outputs.SHORT_SHA }}
                  cache-from: type=local,src=/tmp/.buildx-cache
                  cache-to: type=local,dest=/tmp/.buildx-cache,mode=max
    deploy:
        name: Deploy to VPS
        runs-on: ubuntu-latest
        needs: build-and-push # Chỉ chạy khi build thành công
       
        steps:
            - name: Executing remote ssh commands to deploy
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: ${{ secrets.VPS_PORT }}
                  script: |
                      # Login vào Docker Hub (để pull private image nếu có)
                      echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

                      # Pull image mới nhất về
                      docker pull ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKERHUB_PROJECT_NAME }}:latest

                      # Dừng và xóa container cũ (nếu có)
                      docker stop ${{ secrets.DOCKERHUB_PROJECT_NAME }} || true
                      docker rm ${{ secrets.DOCKERHUB_PROJECT_NAME }} || true

                      # Chạy container mới
                      docker run -d \
                      --name ${{ secrets.DOCKERHUB_PROJECT_NAME }} \
                      --restart always \
                      --network app-net \
                      -p 9000:9000 \
                      -e NODE_ENV=production \
                      -e POSTGRES_HOST=${{ secrets.PROD_DB_HOST }} \
                      -e POSTGRES_USER=${{ secrets.PROD_DB_USER }} \
                      -e POSTGRES_PASSWORD=${{ secrets.PROD_DB_PASSWORD }} \
                      -e POSTGRES_DB=${{ secrets.PROD_DB_NAME }} \
                      -e POSTGRES_PORT=5432 \
                        ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKERHUB_PROJECT_NAME }}:latest

                      # Dọn dẹp các image cũ không dùng đến để tránh đầy ổ cứng
                      docker image prune -f
                      
            - name: Trigger frontend pipeline
              run: |
                curl -X POST \
                  -H "Authorization: Bearer ${{ secrets.MY_PAT_TOKEN }}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  api.github.com \
                  -d '{"event_type":"backend_deployed"}'

